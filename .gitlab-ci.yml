workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "podsan"'

build:
  tags:
    - podman-deploy
  script:
    - |
      if [ -z "${CI_REGISTRY:-}" ] ||
         [ -z "${CI_REGISTRY_IMAGE:-}" ] ||
         [ -z "${CI_REGISTRY_USER:-}" ] ||
         [ -z "${CI_REGISTRY_PASSWORD:-}" ]; then
        printf '%s\n' \
          "GitLab Container Registry variables are unavailable." \
          "Enable the Container Registry for both the GitLab instance and this project." >&2
        exit 1
      fi
    - export IMAGE_SHA="${CI_REGISTRY_IMAGE}:podsan-${CI_COMMIT_SHORT_SHA}"
    - export IMAGE_BRANCH="${CI_REGISTRY_IMAGE}:podsan"
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - |
      docker build \
        --build-arg EDS_IMAGE_PREFIX \
        --build-arg HTTP_PROXY \
        --build-arg HTTPS_PROXY \
        --build-arg NO_PROXY \
        --build-arg http_proxy \
        --build-arg https_proxy \
        --build-arg no_proxy \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --tag "$IMAGE_SHA" \
        --tag "$IMAGE_BRANCH" \
        .
    - docker push "$IMAGE_SHA"
    - docker push "$IMAGE_BRANCH"
  after_script:
    - |
      if [ -n "${CI_REGISTRY:-}" ]; then
        docker logout "$CI_REGISTRY"
      fi
